# config options for branching an ensemble
[branch_ensemble]

# start and end numbers for runs to set up and run
# branch runs.
# It is assumed that control runs have already been
# conducted for these runs.
start_run = 0
end_run = 3

# Path to thermal forcing file for the mesh to be used in the branch run
TF_file_path = /global/cfs/cdirs/fanssie/MALI_projects/Kanger_from_GIS1km/forcing/Kanger_MIROC5-rcp85_oceanThermalForcing_AND_runoff.nc

# Path to SMB forcing file for the mesh to be used in the branch run
SMB_file_path = /global/cfs/cdirs/fanssie/MALI_projects/Kanger_from_GIS1km/forcing/Kanger_MIROC5-rcp85_sfcMassBal_minus1_bare_land.nc

# location of control ensemble to branch from
control_test_dir = /pscratch/sd/h/hoffman2/KANGER1km_STUDY/Kanger_control_ensemble_test_4params_32runs/landice/ensemble_generator/control_ensemble

# year of control simulation from which to branch runs
branch_year = 2020

# whether to only set up branch runs for filtered runs or all runs
set_up_filtered_only = False

# path to pickle file containing filtering information generated by plot_ensemble.py
ensemble_pickle_file = None

[parallel]
account = m4288
qos = regular

[job]
wall_time = 8:00:00
